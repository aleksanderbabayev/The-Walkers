<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="app-version" content="0.1.34">
  <title>The Walkers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=0.1.34">
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">↗</span><div><div class="brandTitle"><strong>The Walkers</strong><span class="appVersion" id="appVersion"></span></div><small>Исследуй город пешком</small></div></div>
    <div class="headerActions">
      <button id="musicToggle" class="icon soundToggle" type="button" aria-label="Выключить фоновую музыку" aria-pressed="true" title="Выключить фоновую музыку">🔊</button>
    </div>
  </header>
  <audio id="backgroundMusic" src="assets/audio/chest_of_adventure.mp3" preload="none" loop aria-hidden="true"></audio>
  <main>
    <div class="mapFrame">
      <section id="map" aria-label="Карта"></section>
      <button id="locate" class="mapLocate" type="button" title="Моё местоположение" aria-label="Моё местоположение">◎</button>
    </div>
    <section class="panel">
      <div class="status">
        <span id="statusDot" aria-hidden="true"></span>
        <div><b id="statusTitle">Готовы к прогулке?</b><small id="statusText">Нажмите «Начать захват территории», чтобы записать маршрут</small></div>
        <div class="stopwatch" aria-label="Время прогулки">
          <b id="elapsed">00:00:00</b>
          <small id="distance">0,00 км</small>
          <small class="gps" id="gps">GPS</small>
        </div>
      </div>
      <div class="actions single-action">
        <button id="start" class="primary" type="button" disabled>
          <svg class="actionIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 21V4m1 1c4-2 8 2 13 0v10c-5 2-9-2-13 0" /></svg>
          <span>Начать захват территории</span>
        </button>
        <button id="abandonWalk" class="secondary" type="button" hidden>
          <svg class="actionIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 20 6v5c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V6l8-3Z" /></svg>
          <span id="abandonLabel">Отмена</span>
        </button>
        <button id="finish" class="capture-button" type="button" hidden disabled>
          <svg class="actionIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 4 3-1 1 5 4 4-1 1-4-4-5-1 1-4Zm16 0-3-1-1 5-4 4 1 1 4-4 5-1-1-4Z" /><path d="m7 8-4 4m14-4 4 4M8 16l-3 3m11-3 3 3" /></svg>
          <span>Захватить территорию!</span>
        </button>
      </div>
      <div id="message" role="status" aria-live="polite"></div>
      <button id="walksToggle" class="walksToggle" type="button" aria-expanded="false" aria-controls="walksDrawer"><span>Мои прогулки</span><span id="walkCountToggle" class="walkCount">0</span><span class="walksChevron" aria-hidden="true">⌃</span></button>
      <section id="walksDrawer" class="saved" aria-hidden="false">
        <div class="drawerHandle" aria-hidden="true"></div>
        <div class="savedHead"><b>Мои прогулки</b><span id="count">0</span><button id="walksClose" class="walksClose" type="button" aria-label="Закрыть список прогулок">×</button></div>
        <div class="walkSummary"><span>Всего пройдено<b id="totalDistance">0,00 км</b></span><span>Общее время<b id="totalDuration">00:00:00</b></span></div>
        <div id="routes"><p class="empty">Здесь появятся ваши маршруты и территории</p></div>
      </section>
    </section>
  </main>
  <button id="walksBackdrop" class="drawerBackdrop" type="button" aria-label="Закрыть список прогулок" hidden></button>
  <footer>Карта © OpenStreetMap · Маршруты хранятся на этом устройстве</footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="tracking-core.js?v=0.1.31"></script>
  <script src="walk-storage.js?v=0.1.31"></script>
  <script src="app.js?v=0.1.34"></script>
</body>
</html>
